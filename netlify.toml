[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
   NODE_VERSION = "22"

[functions]
  # This project is a Vite static build; remove functions directory.
  # If you later add Netlify Functions, set this to the functions folder.
  directory = ""

[[redirects]]
  from = "/__l5e/assets-v1/0114d08a-73df-4c92-be91-9568539c33c3/mna-logo.png"
  to = "/assets/mna-logo.png"
  status = 200
  force = true

[[redirects]]
  # SPA fallback: serve index.html for client-side routes
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
